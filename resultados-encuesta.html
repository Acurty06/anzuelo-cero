<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados de la encuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px; text-align: center;
    font-family: Rubik, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(800px 600px at 50% 0%, rgba(255,107,53,.18), transparent 60%), #0A1322;
    color: #F2F5F9;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: clamp(3.4rem, 17vw, 7rem); font-weight: 900;
    letter-spacing: -.04em; line-height: 1; margin: 0;
    color: #FF6B35;
  }
  .sub {
    font-size: clamp(1.2rem, 5.5vw, 1.7rem); font-weight: 600;
    margin: 22px 0 0; line-height: 1.35;
  }
  .calma { font-size: 1rem; color: #94A7BE; margin: 26px 0 0; line-height: 1.5; }
  .marca {
    font-size: .75rem; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: #5C6F87; margin: 44px 0 0;
  }
</style>
</head>
<body>
  <main>
    <h1>¿En serio?</h1>
    <p class="sub">Acabamos de hablar de esto.</p>
    <p class="calma">Tranquilo, no pasó nada.<br>Gracias por escucharnos.</p>
    <p class="marca">Anzuelo Cero</p>
  </main>
</body>
</html>
